<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Solar Studio · Arma el sistema solar en 3D</title>
    <link rel="stylesheet" href="./css/studio.css?v=1" />
    <link
      rel="icon"
      type="image/png"
      href="../app-assets/identidad/logo.png"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="studio-body">
    <div class="studio-app">
      <header class="studio-topbar">
        <div class="studio-brand">
          <div class="studio-logo" role="img" aria-label="Sistema Solar Studio"></div>
          <div class="studio-brand__copy">
            <strong>Sistema Solar Studio</strong>
            <span>Arma el sistema solar en 3D</span>
          </div>
        </div>

        <nav class="studio-nav">
          <a class="is-active" href="./studio.html">
            <i data-lucide="box"></i>
            <span>Estudio</span>
          </a>
          <a href="./">
            <i data-lucide="gallery-horizontal-end"></i>
            <span>Galería</span>
          </a>
          <a href="./#biblioteca">
            <i data-lucide="book-open"></i>
            <span>Biblioteca</span>
          </a>
        </nav>

        <div class="studio-avatar" aria-hidden="true"></div>
      </header>

      <main class="studio-workspace">
        <aside class="tool-rail" aria-label="Herramientas">
          <button class="is-active" id="btn-place" title="Colocar piezas">
            <i data-lucide="box"></i>
            <span>Colocar</span>
          </button>
          <button id="btn-focus" title="Centrar vista">
            <i data-lucide="scan"></i>
            <span>Centrar</span>
          </button>
          <button id="btn-hints" class="is-active" title="Mostrar pistas">
            <i data-lucide="sparkles"></i>
            <span>Pistas</span>
          </button>
          <button id="btn-zoom-in" title="Acercar">
            <i data-lucide="zoom-in"></i>
            <span>Zoom +</span>
          </button>
          <button id="btn-zoom-out" title="Alejar">
            <i data-lucide="zoom-out"></i>
            <span>Zoom -</span>
          </button>
        </aside>

        <section class="scene-shell">
          <div class="scene-canvas-wrap">
            <canvas id="assembly-canvas" aria-label="Escena 3D para armar el sistema solar"></canvas>
          </div>

          <footer class="scene-actions">
            <section class="lesson-panel" aria-live="polite">
              <div class="lesson-panel__main">
                <span class="lesson-panel__eyebrow">Aprende mientras armas</span>
                <h3 id="lesson-title">Sol</h3>
                <p id="lesson-summary"></p>
              </div>
              <dl class="lesson-panel__meta">
                <div>
                  <dt>Característica</dt>
                  <dd id="lesson-function"></dd>
                </div>
                <div>
                  <dt>Ubicación</dt>
                  <dd id="lesson-location"></dd>
                </div>
              </dl>
              <div class="lesson-panel__fact">
                <i data-lucide="lightbulb"></i>
                <span id="lesson-fact"></span>
              </div>
            </section>

            <div class="scene-actions__buttons">
              <button id="btn-undo" title="Deshacer última pieza">
                <i data-lucide="undo-2"></i>
                <span>Deshacer</span>
              </button>
              <button id="btn-reset" title="Reiniciar armado">
                <i data-lucide="rotate-ccw"></i>
                <span>Reiniciar</span>
              </button>
            </div>
          </footer>
        </section>

        <aside class="piece-panel">
          <div class="piece-panel__header">
            <div>
              <h2>Piezas</h2>
              <span id="piece-counter" class="piece-counter">0 / 9 colocadas</span>
            </div>
            <button id="btn-shuffle" title="Elegir una pieza pendiente al azar">
              <i data-lucide="shuffle"></i>
            </button>
          </div>

          <div class="completion-banner" id="completion-banner">
            <strong>Sistema solar armado</strong>
            <span>Completaste las 9 piezas.</span>
          </div>

          <div class="piece-grid" id="piece-grid"></div>

          <div class="scene-toggles" role="group" aria-label="Ajustes de escena">
            <label class="scene-toggle">
              <span><i data-lucide="layers"></i> Sombras</span>
              <input type="checkbox" id="toggle-shadows" />
              <span class="switch" aria-hidden="true"></span>
            </label>
            <label class="scene-toggle">
              <span><i data-lucide="grid-3x3"></i> Cuadrícula</span>
              <input type="checkbox" id="toggle-grid" />
              <span class="switch" aria-hidden="true"></span>
            </label>
            <label class="scene-toggle">
              <span><i data-lucide="tag"></i> Etiquetas</span>
              <input type="checkbox" id="toggle-labels" />
              <span class="switch" aria-hidden="true"></span>
            </label>
          </div>
        </aside>
      </main>
    </div>

    <div class="toast" id="studio-toast">Listo</div>

    <script type="module" src="./js/studio.js?v=1"></script>
  </body>
</html>
